[project]
name = "llm-search"
version = "0.2.0"
description = "Enterprise self-hostable multi-provider RAG search over web content."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "qdrant-client>=1.11",
    "openai>=1.40",
    "anthropic>=0.30",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]
semantic = [
    "sentence-transformers>=2.3",
]
faiss = [
    "faiss-cpu>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests requiring API keys / external services",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_search*"]

[project.scripts]
sift = "llm_search.cli:main"
