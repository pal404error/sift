<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sift Search</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .result-item { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .source-link { color: #0066cc; text-decoration: none; }
        .source-link:hover { text-decoration: underline; }
        form { margin-bottom: 20px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        pre { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Sift Search</h1>
    <form id="search-form">
        <input type="text" id="query" name="query" placeholder="Enter query..." required>
        <button type="submit" name="action" value="search">Search</button>
        <button type="submit" name="action" value="ask">Ask</button>
        <label style="align-self:center;"><input type="checkbox" id="hyde"> HyDE</label>
    </form>
    <div id="results"></div>

    <script>
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const action = e.submitter.value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                // Determine base URL, but default to / if we are on the same origin
                const url = `/${action}?q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (action === 'search') {
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML = data.results.map(r => `
                            <div class="result-item">
                                <h3><a class="source-link" href="${r.payload.doc_url}" target="_blank">${r.payload.doc_title || r.payload.doc_url}</a></h3>
                                <p>${r.payload.text}</p>
                            </div>
                        `).join('');
                    } else {
                        resultsDiv.innerHTML = '<p>No results found.</p>';
                    }
                } else if (action === 'ask') {
                    const hyde = document.getElementById('hyde').checked;
                    const streamUrl = `/ask/stream?q=${encodeURIComponent(query)}${hyde ? '&hyde=1' : ''}`;
                    resultsDiv.innerHTML =
                        '<div class="result-item"><p><strong>Answer:</strong> <span id="answer"></span></p><div id="sources"></div></div>';
                    const answerEl = document.getElementById('answer');
                    const sourcesEl = document.getElementById('sources');
                    try {
                        const response = await fetch(streamUrl);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();
                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (!trimmed.startsWith('data:')) continue;
                                const json = trimmed.slice(5).trim();
                                if (!json) continue;
                                const evt = JSON.parse(json);
                                if (evt.type === 'sources') {
                                    if (evt.sources && evt.sources.length) {
                                        sourcesEl.innerHTML =
                                            '<h4>Sources:</h4><ul>' +
                                            evt.sources.map(s => `<li><a class="source-link" href="${s}" target="_blank">${s}</a></li>`).join('') +
                                            '</ul>';
                                    }
                                } else if (evt.type === 'token') {
                                    answerEl.textContent += evt.text;
                                }
                            }
                        }
                    } catch (error) {
                        answerEl.textContent += `\n[error: ${error.message}]`;
                    }
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
